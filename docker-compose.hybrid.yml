# Docker Compose con contenedores Windows (app) y opción de base de datos externa
# Nota: Windows Server 2016 soporta Docker Windows Containers (no LCOW por defecto)
version: '3.8'

services:
  app:
    build: .
    image: proyecto_asistencia:win2016
    restart: unless-stopped
    isolation: process
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=example_password
      - DB_NAME=asistencia_db
      - NODE_ENV=production

  # Si habilitas LCOW y necesitas levantar MySQL en Linux, descomenta este servicio
  # db:

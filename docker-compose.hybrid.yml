# Docker Compose con contenedores híbridos (Windows + Linux)
# Requiere Docker Desktop con LCOW habilitado en Windows Server 2016
version: '3.8'

services:
  app:
    build: .
    platform: windows/amd64
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=example_password
      - DB_NAME=asistencia_db
      - NODE_ENV=production
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example_password
      MYSQL_DATABASE: asistencia_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: nat

# Para usar este archivo:
# docker-compose -f docker-compose.hybrid.yml up --build

version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Para MySQL instalado en el host de Windows Server
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=example_password
      - DB_NAME=asistencia_db
      - NODE_ENV=production
    volumes:
      - C:\Users\jesuu\OneDrive\Escritorio\c#\test\Proyecto_Asistencia:C:\app:ro
    networks:
      - app-network

networks:
  app-network:
    driver: nat

# Nota: MySQL debe instalarse como servicio en Windows Server 2016
# Descarga: https://dev.mysql.com/downloads/mysql/
# Después de instalar MySQL en Windows:
# 1. Configura la base de datos con las credenciales de arriba
# 2. Ejecuta: docker-compose up --build

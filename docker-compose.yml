version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=example_password
      - DB_NAME=asistencia_db
      - NODE_ENV=production
    depends_on:
      - db
    volumes:
      - ./:/usr/src/app:cached

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example_password
      MYSQL_DATABASE: asistencia_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
